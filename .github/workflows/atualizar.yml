name: Atualizar imóveis

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 05:00 em Mato Grosso do Sul (09:00 UTC)
  workflow_dispatch:
    inputs:
      modo:
        description: "completo = coleta tudo e publica; teste = só confere se cada fonte responde"
        type: choice
        options: [completo, teste]
        default: completo

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-imoveis
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coleta/requirements.txt

      - run: pip install -r coleta/requirements.txt

      - name: Teste rápido das fontes
        if: ${{ github.event.inputs.modo == 'teste' }}
        run: python coleta/rodar.py --teste

      # guarda a última coleta boa de cada fonte entre uma execução e outra
      - name: Recuperar coletas anteriores
        if: ${{ github.event.inputs.modo != 'teste' }}
        uses: actions/cache/restore@v4
        with:
          path: brutos
          key: brutos-${{ github.run_id }}
          restore-keys: brutos-

      - name: Coletar e montar os dados
        if: ${{ github.event.inputs.modo != 'teste' }}
        run: python coleta/rodar.py

      - name: Guardar coletas
        if: ${{ always() && github.event.inputs.modo != 'teste' }}
        uses: actions/cache/save@v4
        with:
          path: brutos
          key: brutos-${{ github.run_id }}

      - name: Registrar a atualização no repositório
        if: ${{ github.event.inputs.modo != 'teste' }}
        run: |
          cp site/dados/status.js ultima-atualizacao.js
          git config user.name "atualizador"
          git config user.email "atualizador@users.noreply.github.com"
          git add ultima-atualizacao.js
          git commit -m "Atualização diária $(date -u +%F)" || echo "nada mudou"
          git push || echo "push falhou (não impede a publicação)"

      - uses: actions/configure-pages@v5
        if: ${{ github.event.inputs.modo != 'teste' }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ github.event.inputs.modo != 'teste' }}
        with:
          path: site

      - id: publicar
        if: ${{ github.event.inputs.modo != 'teste' }}
        uses: actions/deploy-pages@v4
